plugins { id 'com.android.application' }

android {
    namespace 'com.noir.game.engine'
    compileSdk 35
    defaultConfig {
        applicationId 'com.noir.game.engine'
        minSdk 26
        targetSdk 35
        versionCode 40
        versionName '0.4.0'
    }
    buildTypes {
        debug { debuggable true; minifyEnabled false }
        release { minifyEnabled false; shrinkResources false }
    }
}

dependencies { implementation project(':engine') }
