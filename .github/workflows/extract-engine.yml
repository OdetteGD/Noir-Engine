name: Extract Noir Engine v0.4

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP
        id: find_zip
        run: |
          set -e

          ZIP=$(find . -type f -iname "*.zip" \
            ! -path "./.git/*" \
            | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP found."
            find . -maxdepth 4 -type f
            exit 1
          fi

          echo "Found: $ZIP"
          echo "zip_path=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        run: |
          set -e

          ZIP="${{ steps.find_zip.outputs.zip_path }}"

          rm -rf _noir_extract
          mkdir -p _noir_extract

          unzip -o "$ZIP" -d _noir_extract

      - name: Copy Noir Engine
        run: |
          set -e

          ROOT="_noir_extract"

          COUNT=$(find "$ROOT" -mindepth 1 -maxdepth 1 | wc -l)

          if [ "$COUNT" -eq 1 ] && \
             [ -d "$(find "$ROOT" -mindepth 1 -maxdepth 1 -type d)" ]; then

            ROOT=$(find "$ROOT" -mindepth 1 -maxdepth 1 -type d)

          fi

          cp -a "$ROOT"/. .

      - name: Remove imported GitHub workflows
        run: |
          echo "Removing workflows that require workflow permission..."

          find .github/workflows \
            -type f \
            ! -name "extract-engine.yml" \
            -delete 2>/dev/null || true

      - name: Cleanup
        run: |
          rm -rf _noir_extract

          find . -type f -iname "*.zip" \
            ! -path "./.git/*" \
            -delete

      - name: Show project
        run: |
          echo "===== NOIR ENGINE ====="
          find . -maxdepth 4 -type f \
            ! -path "./.git/*" \
            | sort

      - name: Commit and push
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Add Noir 3D Game Engine v0.4"
          git push
