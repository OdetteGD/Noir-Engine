name: Noir Engine Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true
        default: "0.4.0"

permissions:
  contents: write

jobs:
  release:
    name: Build Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew assembleRelease

      - name: Package engine
        run: |
          mkdir -p release

          zip -r \
            "release/Noir3D-Game-Engine-${{ github.event.inputs.version }}.zip" \
            app \
            engine \
            docs \
            tools \
            build.gradle \
            settings.gradle \
            gradle.properties \
            README.md \
            2>/dev/null || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.event.inputs.version }}"
          name: "Noir 3D Game Engine v${{ github.event.inputs.version }}"
          generate_release_notes: true
          files: |
            release/*
            app/build/outputs/apk/**/*.apk
