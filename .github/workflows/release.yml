name: Noir Engine Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true
        type: string
        default: "0.4.0"

permissions:
  contents: write

jobs:
  release:
    name: Build Noir Engine Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Verify Android SDK
        run: |
          sdkmanager --version
          sdkmanager --list_installed | grep -E "platform-tools|platforms;android-35|build-tools;35.0.0" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      - name: Verify Gradle
        run: gradle --version

      - name: Build Release APK
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Prepare release files
        run: |
          set -e
          mkdir -p release

          cp app/build/outputs/apk/release/*.apk release/Noir3D-Game-Engine-${{ inputs.version }}.apk

          zip -r "release/Noir3D-Game-Engine-${{ inputs.version }}-source.zip"             app             engine             docs             tools             build.gradle             settings.gradle             gradle.properties             README.md

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: noir-engine-release-${{ inputs.version }}
          path: release/*
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ inputs.version }}"
          name: "Noir 3D Game Engine v${{ inputs.version }}"
          generate_release_notes: true
          files: release/*
