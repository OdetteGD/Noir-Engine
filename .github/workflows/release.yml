name: Noir Engine Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true
        type: string
        default: "0.4.0"

permissions:
  contents: write

jobs:
  release:
    name: Build and Sign Noir Engine
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;28.1.13356709"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      - name: Decode release keystore
        if: ${{ secrets.NOIR_KEYSTORE_B64 != '' }}
        env:
          NOIR_KEYSTORE_B64: ${{ secrets.NOIR_KEYSTORE_B64 }}
        run: |
          echo "$NOIR_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/noir-release.jks"

      - name: Build signed release
        env:
          NOIR_KEYSTORE: ${{ secrets.NOIR_KEYSTORE_B64 != '' && format('{0}/noir-release.jks', runner.temp) || '' }}
          NOIR_STORE_PASSWORD: ${{ secrets.NOIR_STORE_PASSWORD }}
          NOIR_KEY_ALIAS: ${{ secrets.NOIR_KEY_ALIAS }}
          NOIR_KEY_PASSWORD: ${{ secrets.NOIR_KEY_PASSWORD }}
        run: |
          gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify APK
        run: |
          ls -lh app/build/outputs/apk/release/
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: noir-engine-${{ inputs.version }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ inputs.version }}"
          name: "Noir 3D Game Engine v${{ inputs.version }}"
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release.apk