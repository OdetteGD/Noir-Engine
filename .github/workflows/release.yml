name: Noir Engine Release

on:
  push:
    branches:
      - "release-v*"

  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true
        type: string
        default: "1.0.0"

permissions:
  contents: write

jobs:
  release:
    name: Build and Sign Noir Engine
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;28.1.13356709"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == release-v* ]]; then
            VERSION="${GITHUB_REF_NAME#release-v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Noir 3D Game Engine v$VERSION"

      - name: Verify launcher manifest
        shell: bash
        run: |
          grep -q 'android:name=".ProjectManagerActivity"' app/src/main/AndroidManifest.xml
          grep -q 'android:exported="true"' app/src/main/AndroidManifest.xml
          grep -q 'android.intent.action.MAIN' app/src/main/AndroidManifest.xml
          grep -q 'android.intent.category.LAUNCHER' app/src/main/AndroidManifest.xml
          echo "Launcher activity verified: ProjectManagerActivity"

      - name: Build release APK
        shell: bash
        env:
          NOIR_KEYSTORE_B64: ${{ secrets.NOIR_KEYSTORE_B64 }}
          NOIR_STORE_PASSWORD: ${{ secrets.NOIR_STORE_PASSWORD }}
          NOIR_KEY_ALIAS: ${{ secrets.NOIR_KEY_ALIAS }}
          NOIR_KEY_PASSWORD: ${{ secrets.NOIR_KEY_PASSWORD }}
        run: |
          # Use the configured release keystore when all signing secrets are present.
          # Otherwise app/build.gradle falls back to the Android debug keystore so
          # the release pipeline can still produce a testable APK.
          if [[ -n "$NOIR_KEYSTORE_B64" && -n "$NOIR_STORE_PASSWORD" && -n "$NOIR_KEY_ALIAS" && -n "$NOIR_KEY_PASSWORD" ]]; then
            echo "$NOIR_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/noir-release.jks"
            export NOIR_KEYSTORE="$RUNNER_TEMP/noir-release.jks"
            echo "Using configured Noir release keystore."
          else
            unset NOIR_KEYSTORE
            echo "No complete release keystore configured; using debug signing."
          fi

          gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          ls -lh "$APK"
          echo "APK ready: $APK"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: noir-engine-${{ steps.version.outputs.version }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Package C# SDK and release source bundle
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p release-bundle
          cp "app/build/outputs/apk/release/app-release.apk" "release-bundle/Noir-3D-Game-Engine-v${VERSION}.apk"
          zip -qr "release-bundle/Noir-CSharp-Mobile-SDK-v${VERSION}.zip" csharp docs README.md
          zip -qr "release-bundle/Noir-Engine-Source-v${VERSION}.zip" app engine csharp docs README.md settings.gradle build.gradle gradle.properties global.json
          sha256sum release-bundle/* > "release-bundle/SHA256SUMS.txt"
          ls -lh release-bundle

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "Noir 3D Game Engine v${{ steps.version.outputs.version }}"
          generate_release_notes: true
          files: |
            release-bundle/Noir-3D-Game-Engine-v${{ steps.version.outputs.version }}.apk
            release-bundle/Noir-CSharp-Mobile-SDK-v${{ steps.version.outputs.version }}.zip
            release-bundle/Noir-Engine-Source-v${{ steps.version.outputs.version }}.zip
            release-bundle/SHA256SUMS.txt
